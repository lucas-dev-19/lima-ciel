<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Lima Ciel</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FCF9F5">
  <script>
    /* Esta página é exibida em qualquer endereço inexistente. Define a raiz do site para que
       os caminhos funcionem tanto em domínio próprio ("/") quanto no GitHub Pages ("/nome-do-repositorio/"). */
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var root = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/' : '/';
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="conteudo" class="container">
    <div class="notfound">
      <p class="eyebrow">Erro 404</p>
      <h1>Esta página não existe</h1>
      <p>O endereço pode ter mudado. Que tal voltar para a vitrine?</p>
      <a class="btn btn--solid" href="produtos.html">Ver roupas</a>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
